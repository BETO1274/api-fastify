apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-fastify
  namespace: api-fastify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-fastify
  template:
    metadata:
      labels:
        app: api-fastify
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api-fastify
          image: ghcr.io/beto1274/api-fastify-produccion:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-fastify-config
            - secretRef:
                name: api-fastify-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
