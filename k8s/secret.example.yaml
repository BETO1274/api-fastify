# Plantilla de referencia — NO contiene credenciales reales.
# Para aplicar el Secret real, usa el comando imperativo de kubectl (ver README
# de la carpeta k8s/), que nunca deja la contraseña en texto plano en el repo.
apiVersion: v1
kind: Secret
metadata:
  name: api-fastify-secrets
  namespace: api-fastify
type: Opaque
stringData:
  DATABASE_URL: "postgresql://usuario:password@host:5432/postgres?sslmode=require"
  TEAM_API_KEY: "key-compartida-con-deportback-e-inventario-u"
