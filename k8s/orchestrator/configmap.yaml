apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
  namespace: orchestrator
data:
  NODE_ENV: "production"
  SERVICEBUS_QUEUE_NAME: "tareas-orquestador"
  # Debe coincidir con maxDeliveryCount de la cola (infra/main.bicep).
  SERVICEBUS_MAX_DELIVERY_COUNT: "3"
  # Nuestra API se llama por dentro del clúster (DNS interno del Service),
  # sin salir a internet ni pasar por Cloudflare — así QUERY funciona.
  API_FASTIFY_URL: "http://api-fastify.api-fastify.svc.cluster.local"
  # El gateway llama al orquestador por el Service interno del mismo namespace.
  ORQUESTADOR_URL: "http://orchestrator"
