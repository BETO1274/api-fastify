# Misma imagen que el orquestador, pero arrancando el consumidor de la cola.
# No tiene probes HTTP (no hay endpoint de salud), pero sí expone /metrics
# en METRICS_PORT para las métricas de las llamadas al Storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3101"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: worker
          image: ghcr.io/beto1274/orchestrator-produccion:latest
          command: ["node", "src/worker.js"]
          ports:
            - containerPort: 3101
          envFrom:
            - configMapRef:
                name: orchestrator-config
            - secretRef:
                name: orchestrator-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
