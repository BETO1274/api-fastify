# Misma imagen que el orquestador, pero arrancando el consumidor de la cola.
# No expone puerto ni tiene probes HTTP: es un proceso que solo escucha la cola.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: worker
          image: ghcr.io/beto1274/orchestrator-produccion:latest
          command: ["node", "src/worker.js"]
          envFrom:
            - configMapRef:
                name: orchestrator-config
            - secretRef:
                name: orchestrator-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
