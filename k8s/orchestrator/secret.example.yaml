# Plantilla de referencia — NO contiene credenciales reales.
# El Secret real va en secret.local.yaml (gitignorado) o se crea con
# kubectl create secret (ver README de esta carpeta).
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-secrets
  namespace: orchestrator
type: Opaque
stringData:
  DATABASE_URL: "postgresql://usuario:password@host:5432/postgres?sslmode=require"
  SERVICEBUS_CONNECTION_STRING: "Endpoint=sb://NOMBRE.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=CLAVE"
  TEAM_API_KEY: "key-compartida-con-deportback-e-inventario-u"
