services:
  # Base de datos local para el estado de las tareas (tabla orquestador_tarea).
  # Puerto 5433 para no chocar con un Postgres local en el 5432.
  postgres:
    container_name: orchestrator-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orquestador
      POSTGRES_PASSWORD: orquestador_dev
      POSTGRES_DB: orquestador
    ports:
      - "5433:5432"
    volumes:
      - "./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql"

  sqledge:
    container_name: orchestrator-sqledge
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "OrchestratorDev2026!"
    networks:
      - sb-emulator

  servicebus-emulator:
    container_name: orchestrator-servicebus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - "./emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: orchestrator-sqledge
      MSSQL_SA_PASSWORD: "OrchestratorDev2026!"
      ACCEPT_EULA: "Y"
    networks:
      - sb-emulator
    depends_on:
      - sqledge

networks:
  sb-emulator:
