services:
  sqledge:
    container_name: orchestrator-sqledge
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "OrchestratorDev2026!"
    networks:
      - sb-emulator

  servicebus-emulator:
    container_name: orchestrator-servicebus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - "./emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: orchestrator-sqledge
      MSSQL_SA_PASSWORD: "OrchestratorDev2026!"
      ACCEPT_EULA: "Y"
    networks:
      - sb-emulator
    depends_on:
      - sqledge

networks:
  sb-emulator:
