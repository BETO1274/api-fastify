name: Release de Alloy (observabilidad)

# Un tag alloy-vX.Y.Z valida la configuracion de Alloy, construye la imagen y
# la publica en ghcr.io. Si existen los secretos RENDER_API_KEY y
# RENDER_SERVICE_ID_ALLOY, la despliega en Render por digest SHA256.

on:
  push:
    tags: ['alloy-v*']

permissions:
  contents: write
  packages: write

env:
  IMAGEN: ghcr.io/beto1274/canary-alloy

jobs:
  release:
    name: Validar, publicar y desplegar Alloy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar la sintaxis de config.alloy
        run: |
          docker run --rm -v "$PWD/observabilidad:/cfg" grafana/alloy:v1.5.1 fmt /cfg/config.alloy > /dev/null
          echo "config.alloy valida"

      - name: Login en ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build y push de la imagen
        id: imagen
        run: |
          TAG="${{ github.ref_name }}"
          docker build -t $IMAGEN:$TAG ./observabilidad
          docker push $IMAGEN:$TAG
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGEN:$TAG)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Imagen inmutable: $DIGEST"

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }} (alloy)" \
            --notes "Imagen: \`${{ steps.imagen.outputs.digest }}\`" \
            --verify-tag

      - name: Desplegar en Render (por digest)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_ALLOY }}
        run: |
          if [ -z "$SERVICE_ID" ] || [ -z "$RENDER_API_KEY" ]; then
            echo "Sin RENDER_SERVICE_ID_ALLOY o RENDER_API_KEY: se omite el despliegue"
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"${{ steps.imagen.outputs.digest }}\"}"
