name: Pipeline Producción

on:
  push:
    branches: [produccion]
  pull_request:
    branches: [produccion]

env:
  # Conexión directa (no pooler): evita inconsistencia de caché de esquema justo tras migrar
  DATABASE_URL: ${{ secrets.MIGRATION_DB_URL_PROD }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build, pruebas y quality gate (Producción)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (lint)
        run: npm run lint

      - name: Aplicar migraciones pendientes a Supabase Producción
        run: npx supabase db push --db-url "${{ secrets.MIGRATION_DB_URL_PROD }}" --yes

      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      - name: Quality gate — cobertura mínima 85%
        run: npm run check-coverage -- 85

      - name: Build de imagen Docker
        run: docker build -t api-fastify-produccion .

      - name: Smoke test — el contenedor arranca y responde
        run: |
          docker run -d --name smoke-test -p 3000:3000 \
            -e DATABASE_URL="${{ secrets.MIGRATION_DB_URL_PROD }}" \
            -e PORT=3000 \
            api-fastify-produccion

          listo=""
          for intento in $(seq 1 10); do
            if curl -fsS http://localhost:3000/docs > /dev/null 2>&1; then
              listo="si"
              break
            fi
            sleep 1
          done

          docker logs smoke-test
          docker rm -f smoke-test

          if [ -z "$listo" ]; then
            echo "El contenedor nunca respondió en /docs"
            exit 1
          fi
          echo "Contenedor arrancó y respondió correctamente"

      - name: Publicar imagen en GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag api-fastify-produccion ghcr.io/beto1274/api-fastify-produccion:${{ github.sha }}
          docker tag api-fastify-produccion ghcr.io/beto1274/api-fastify-produccion:latest
          docker push ghcr.io/beto1274/api-fastify-produccion:${{ github.sha }}
          docker push ghcr.io/beto1274/api-fastify-produccion:latest

  deploy:
    name: Desplegar en Render (Producción)
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Disparar despliegue en Render
        run: curl --fail-with-body -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"

      - name: Registrar el Dockerfile desplegado en la rama deploys
        run: |
          cp Dockerfile /tmp/Dockerfile.deployed

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin deploys
          git checkout deploys

          mkdir -p deploys
          {
            echo "# Dockerfile desplegado — Producción"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Fecha (UTC): $(date -u +"%Y-%m-%d %H:%M:%S")"
            echo ""
            echo '```dockerfile'
            cat /tmp/Dockerfile.deployed
            echo '```'
          } > deploys/dockerfile-produccion.md

          git add deploys/dockerfile-produccion.md
          if ! git diff --cached --quiet; then
            git commit -m "📝 :memo: registrar dockerfile desplegado en produccion"
            git push origin deploys
          else
            echo "Sin cambios en el Dockerfile desplegado"
          fi
