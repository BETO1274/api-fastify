name: Terraform - Destruir infraestructura

# Manual a propósito, y con un segundo clic de confirmación (input "confirmar")
# para no borrar la infraestructura por accidente desde la pestaña Actions.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe "destruir" para confirmar que quieres borrar TODA la infraestructura de Azure'
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  terraform-destroy:
    name: Destruir infraestructura (Terraform)
    runs-on: ubuntu-latest
    if: github.event.inputs.confirmar == 'destruir'
    defaults:
      run:
        working-directory: terraform
    # El backend "azurerm" (use_azuread_auth=true) y el provider autentican
    # con estas variables ARM_* directamente - no con la sesión de Azure CLI,
    # porque esa sesión sería de un Service Principal y el backend solo
    # acepta CLI auth para cuentas de usuario.
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=api-fastify.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform destroy
        run: |
          terraform destroy -auto-approve \
            -var="postgres_admin_password=${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            -var="ghcr_token=${{ secrets.GHCR_READ_TOKEN }}" \
            -var="team_api_key=${{ secrets.TEAM_API_KEY }}"
