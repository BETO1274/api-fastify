name: Pipeline Pruebas

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

env:
  # Conexión directa (no pooler): evita inconsistencia de caché de esquema justo tras migrar
  DATABASE_URL: ${{ secrets.MIGRATION_DB_URL_TEST }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build, pruebas y quality gate (Pruebas)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (lint)
        run: npm run lint

      - name: Aplicar migraciones pendientes a Supabase Test
        run: npx supabase db push --db-url "${{ secrets.MIGRATION_DB_URL_TEST }}" --yes

      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      - name: Quality gate — cobertura mínima 60%
        run: npm run check-coverage -- 60

      - name: Build de imagen Docker
        run: docker build -t api-fastify-test .

      - name: Smoke test — el contenedor arranca y responde
        run: |
          docker run -d --name smoke-test -p 3000:3000 \
            -e DATABASE_URL="${{ secrets.MIGRATION_DB_URL_TEST }}" \
            -e PORT=3000 \
            api-fastify-test

          listo=""
          for intento in $(seq 1 10); do
            if curl -fsS http://localhost:3000/docs > /dev/null 2>&1; then
              listo="si"
              break
            fi
            sleep 1
          done

          docker logs smoke-test
          docker rm -f smoke-test

          if [ -z "$listo" ]; then
            echo "El contenedor nunca respondió en /docs"
            exit 1
          fi
          echo "Contenedor arrancó y respondió correctamente"

      - name: Publicar imagen en GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag api-fastify-test ghcr.io/beto1274/api-fastify-test:${{ github.sha }}
          docker tag api-fastify-test ghcr.io/beto1274/api-fastify-test:latest
          docker push ghcr.io/beto1274/api-fastify-test:${{ github.sha }}
          docker push ghcr.io/beto1274/api-fastify-test:latest

  deploy:
    name: Desplegar en Render (Test)
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar despliegue en Render
        run: curl --fail-with-body -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_TEST }}"
