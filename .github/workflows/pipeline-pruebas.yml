name: Pipeline Pruebas

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

env:
  # Postgres efímero del propio runner (ver "services" abajo) — ya no
  # depende de que un proyecto externo de Supabase esté despierto. Las
  # migraciones en supabase/migrations/ son SQL estándar (nada específico
  # de Supabase), así que corren igual contra cualquier Postgres.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build, pruebas y quality gate (Pruebas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático (lint)
        run: npm run lint

      - name: Aplicar migraciones al Postgres efímero
        run: |
          for archivo in supabase/migrations/*.sql; do
            echo "Aplicando $archivo..."
            PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$archivo"
          done

      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      - name: Quality gate — cobertura mínima 60%
        run: npm run check-coverage -- 60

      - name: Build de imagen Docker
        run: docker build -t api-fastify-test .

      - name: Smoke test — el contenedor arranca y responde
        run: |
          # --network host: así el contenedor alcanza el Postgres efímero
          # del job (expuesto en localhost:5432 del runner).
          docker run -d --name smoke-test --network host \
            -e DATABASE_URL="postgresql://postgres:postgres@localhost:5432/postgres" \
            -e PORT=3000 \
            api-fastify-test

          listo=""
          for intento in $(seq 1 10); do
            if curl -fsS http://localhost:3000/docs > /dev/null 2>&1; then
              listo="si"
              break
            fi
            sleep 1
          done

          docker logs smoke-test
          docker rm -f smoke-test

          if [ -z "$listo" ]; then
            echo "El contenedor nunca respondió en /docs"
            exit 1
          fi
          echo "Contenedor arrancó y respondió correctamente"

      - name: Lint y pruebas del orchestrator
        working-directory: orchestrator
        run: |
          npm ci
          npm run lint
          npm test

      - name: Lint y pruebas del gateway
        working-directory: gateway
        run: |
          npm ci
          npm run lint
          npm test

      - name: Build de imágenes Docker del orchestrator y del gateway
        run: |
          docker build -t orchestrator-test ./orchestrator
          docker build -t gateway-test ./gateway

      - name: Smoke test — orchestrator y gateway arrancan y se hablan
        run: |
          docker network create smoke-net
          docker run -d --name smoke-orq --network smoke-net orchestrator-test
          docker run -d --name smoke-gw --network smoke-net -p 3200:3200 \
            -e ORQUESTADOR_URL=http://smoke-orq:3100 gateway-test

          listo=""
          for intento in $(seq 1 15); do
            if curl -fsS http://localhost:3200/api_fastify/articulos/1 -o /tmp/tarea.json 2>/dev/null; then
              listo="si"
              break
            fi
            sleep 1
          done

          docker logs smoke-orq
          docker logs smoke-gw
          docker rm -f smoke-orq smoke-gw
          docker network rm smoke-net

          if [ -z "$listo" ]; then
            echo "El gateway nunca respondió"
            exit 1
          fi
          cat /tmp/tarea.json
          grep -q '"estado":"pendiente"' /tmp/tarea.json
          echo "Gateway y orchestrator arrancaron y la tarea llegó al orquestador"

      - name: Publicar imagen en GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag api-fastify-test ghcr.io/beto1274/api-fastify-test:${{ github.sha }}
          docker tag api-fastify-test ghcr.io/beto1274/api-fastify-test:latest
          docker push ghcr.io/beto1274/api-fastify-test:${{ github.sha }}
          docker push ghcr.io/beto1274/api-fastify-test:latest
          docker tag orchestrator-test ghcr.io/beto1274/orchestrator-test:${{ github.sha }}
          docker tag orchestrator-test ghcr.io/beto1274/orchestrator-test:latest
          docker push ghcr.io/beto1274/orchestrator-test:${{ github.sha }}
          docker push ghcr.io/beto1274/orchestrator-test:latest
          docker tag gateway-test ghcr.io/beto1274/gateway-test:${{ github.sha }}
          docker tag gateway-test ghcr.io/beto1274/gateway-test:latest
          docker push ghcr.io/beto1274/gateway-test:${{ github.sha }}
          docker push ghcr.io/beto1274/gateway-test:latest
