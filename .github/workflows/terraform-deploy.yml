name: Terraform - Desplegar infraestructura + API

# Manual a propósito: crear infraestructura en la nube cuesta dinero, no
# debe dispararse en cada push. Se corre desde la pestaña Actions → "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  terraform-apply:
    name: Desplegar infraestructura (Terraform) + instalar la API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    # El backend "azurerm" (use_azuread_auth=true) y el provider autentican
    # con estas variables ARM_* directamente - no con la sesión de Azure CLI
    # que deja azure/login@v2, porque esa sesión es de un Service Principal
    # y el backend solo acepta CLI auth para cuentas de usuario.
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=api-fastify.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform validate
        run: terraform validate

      # Fase 1: todo menos los Container Apps. Los contenedores necesitan
      # que Postgres ya tenga el esquema aplicado, así que arrancarlos antes
      # de migrar los dejaría crasheando contra una base vacía.
      - name: "Terraform apply (fase 1 — infraestructura base, sin los contenedores)"
        run: |
          terraform apply -auto-approve \
            -var="postgres_admin_password=${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            -var="ghcr_token=${{ secrets.GITHUB_TOKEN }}" \
            -var="team_api_key=${{ secrets.TEAM_API_KEY }}" \
            -target=module.azure_platform.azurerm_resource_group.principal \
            -target=module.azure_platform.azurerm_postgresql_flexible_server.principal \
            -target=module.azure_platform.azurerm_postgresql_flexible_server_firewall_rule.permitir_todo \
            -target=module.azure_platform.azurerm_servicebus_namespace.principal \
            -target=module.azure_platform.azurerm_servicebus_queue.tareas_orquestador \
            -target=module.azure_platform.azurerm_log_analytics_workspace.principal \
            -target=module.azure_platform.azurerm_monitor_workspace.principal \
            -target=module.azure_platform.azurerm_container_app_environment.principal

      - name: Guardar outputs de Terraform
        id: tf
        run: |
          echo "postgres_host=$(terraform output -raw postgres_host)" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias (raíz, para el script de migración)
        working-directory: .
        run: npm ci

      - name: Aplicar el esquema y migrar los datos reales
        working-directory: .
        env:
          ORIGEN_URL: ${{ secrets.MIGRATION_DB_URL_PROD }}
          DESTINO_URL: postgresql://apiadmin:${{ secrets.POSTGRES_ADMIN_PASSWORD }}@${{ steps.tf.outputs.postgres_host }}:5432/postgres?sslmode=require
        run: node infra/scripts/migrar-a-azure.js

      - name: Inicializar la tabla del orquestador
        working-directory: orchestrator
        env:
          DATABASE_URL: postgresql://apiadmin:${{ secrets.POSTGRES_ADMIN_PASSWORD }}@${{ steps.tf.outputs.postgres_host }}:5432/postgres?sslmode=require
        run: |
          npm ci
          node scripts/aplicar-esquema.js

      # Fase 2: ya con la base lista, crea los 4 Container Apps (api-fastify,
      # orchestrator, worker, gateway) — un solo "apply" instala la API
      # completa, sin kubectl ni manifiestos de por medio.
      - name: "Terraform apply (fase 2 — los 4 Container Apps)"
        run: |
          terraform apply -auto-approve \
            -var="postgres_admin_password=${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            -var="ghcr_token=${{ secrets.GITHUB_TOKEN }}" \
            -var="team_api_key=${{ secrets.TEAM_API_KEY }}"

      - name: Mostrar las URLs públicas
        run: |
          echo "api-fastify: $(terraform output -raw api_fastify_url)"
          echo "gateway:     $(terraform output -raw gateway_url)"
