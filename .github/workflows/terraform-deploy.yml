name: Terraform - Desplegar infraestructura + API

# Manual a propósito: crear infraestructura en la nube cuesta dinero, no
# debe dispararse en cada push. Se corre desde la pestaña Actions → "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  terraform-apply:
    name: Desplegar infraestructura (Terraform) + instalar la API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=api-fastify.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform apply
        run: |
          terraform apply -auto-approve \
            -var="postgres_admin_password=${{ secrets.POSTGRES_ADMIN_PASSWORD }}"

      - name: Guardar outputs de Terraform
        id: tf
        run: |
          echo "resource_group=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "aks_name=$(terraform output -raw aks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "postgres_host=$(terraform output -raw postgres_host)" >> "$GITHUB_OUTPUT"
          echo "servicebus_namespace=$(terraform output -raw servicebus_namespace)" >> "$GITHUB_OUTPUT"

      - name: Obtener la connection string de Service Bus (la generó Terraform, no es un secret fijo)
        id: sb
        run: |
          cs=$(az servicebus namespace authorization-rule keys list \
            --resource-group "${{ steps.tf.outputs.resource_group }}" \
            --namespace-name "${{ steps.tf.outputs.servicebus_namespace }}" \
            --name RootManageSharedAccessKey \
            --query primaryConnectionString -o tsv)
          echo "::add-mask::$cs"
          echo "connection_string=$cs" >> "$GITHUB_OUTPUT"

      - name: Obtener credenciales de AKS
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.tf.outputs.resource_group }}" \
            --name "${{ steps.tf.outputs.aks_name }}" \
            --overwrite-existing

      - name: Instalar dependencias (raíz, para el script de migración)
        working-directory: .
        run: npm ci

      - name: Aplicar el esquema y migrar los datos reales
        working-directory: .
        env:
          ORIGEN_URL: ${{ secrets.MIGRATION_DB_URL_PROD }}
          DESTINO_URL: postgresql://apiadmin:${{ secrets.POSTGRES_ADMIN_PASSWORD }}@${{ steps.tf.outputs.postgres_host }}:5432/postgres?sslmode=require
        run: node infra/scripts/migrar-a-azure.js

      - name: Inicializar la tabla del orquestador
        working-directory: orchestrator
        env:
          DATABASE_URL: postgresql://apiadmin:${{ secrets.POSTGRES_ADMIN_PASSWORD }}@${{ steps.tf.outputs.postgres_host }}:5432/postgres?sslmode=require
        run: |
          npm ci
          node scripts/aplicar-esquema.js

      - name: Crear el Secret de acceso a ghcr.io (usa el token del propio workflow)
        working-directory: .
        run: |
          for ns in api-fastify orchestrator; do
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret docker-registry ghcr-pull-secret \
              --namespace "$ns" \
              --docker-server=ghcr.io \
              --docker-username="${{ github.actor }}" \
              --docker-password="${{ secrets.GITHUB_TOKEN }}" \
              --docker-email="noreply@github.com" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Desplegar api-fastify
        working-directory: .
        env:
          POSTGRES_HOST: ${{ steps.tf.outputs.postgres_host }}
        run: |
          kubectl apply -f k8s/api-fastify/namespace.yaml
          kubectl apply -f k8s/api-fastify/configmap.yaml
          kubectl create secret generic api-fastify-secrets \
            --namespace api-fastify \
            --from-literal=DATABASE_URL="postgresql://apiadmin:${{ secrets.POSTGRES_ADMIN_PASSWORD }}@${POSTGRES_HOST}:5432/postgres?sslmode=require" \
            --from-literal=TEAM_API_KEY="${{ secrets.TEAM_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/api-fastify/deployment.yaml
          kubectl apply -f k8s/api-fastify/service.yaml

      - name: Desplegar orquestador, worker y gateway
        working-directory: .
        env:
          POSTGRES_HOST: ${{ steps.tf.outputs.postgres_host }}
        run: |
          kubectl apply -f k8s/orchestrator/namespace.yaml
          kubectl apply -f k8s/orchestrator/configmap.yaml
          kubectl create secret generic orchestrator-secrets \
            --namespace orchestrator \
            --from-literal=DATABASE_URL="postgresql://apiadmin:${{ secrets.POSTGRES_ADMIN_PASSWORD }}@${POSTGRES_HOST}:5432/postgres?sslmode=require" \
            --from-literal=SERVICEBUS_CONNECTION_STRING="${{ steps.sb.outputs.connection_string }}" \
            --from-literal=TEAM_API_KEY="${{ secrets.TEAM_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/orchestrator/deployment.yaml
          kubectl apply -f k8s/orchestrator/service.yaml
          kubectl apply -f k8s/orchestrator/worker-deployment.yaml
          kubectl apply -f k8s/gateway/deployment.yaml
          kubectl apply -f k8s/gateway/service.yaml

      - name: Esperar a que los Deployments queden listos
        run: |
          kubectl rollout status deployment/api-fastify -n api-fastify --timeout=180s
          kubectl rollout status deployment/orchestrator -n orchestrator --timeout=180s
          kubectl rollout status deployment/worker -n orchestrator --timeout=180s
          kubectl rollout status deployment/gateway -n orchestrator --timeout=180s

      - name: Mostrar las IPs públicas
        run: |
          echo "api-fastify:"
          kubectl get service api-fastify -n api-fastify
          echo "gateway:"
          kubectl get service gateway -n orchestrator
